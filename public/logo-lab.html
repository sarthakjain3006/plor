<!doctype html>

<style>
  body { margin: 0; background: #000; color: #f1f1ee; font-family: ui-monospace, Menlo, monospace; padding: 32px; }

  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  figure { margin: 0; background: #0b0b0b; border: 1px solid #222; border-radius: 12px; padding: 18px; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }

  .small { flex: 0 0 auto; background: #000; border-radius: 10px; padding: 8px; }
  .small svg { width: 42px; height: auto; display: block; }
  figcaption { margin-top: 12px; font-size: 11px; letter-spacing: .12em; color: rgba(241,241,238,.45); text-transform: uppercase; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  .write { stroke-dashoffset: var(--len); animation: draw var(--dur) cubic-bezier(.65,.05,.35,1) var(--delay) forwards; }
  @keyframes drawloop {
    0% { stroke-dashoffset: var(--len); }
    55% { stroke-dashoffset: 0; }
    88% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: var(--len); }
  }
  .writeloop { stroke-dashoffset: var(--len); animation: drawloop 4.5s cubic-bezier(.65,.05,.35,1) infinite; }
  @keyframes pop { to { opacity: 1; } }
  .pop { opacity: 0; animation: pop .28s ease var(--d) forwards; }
  @keyframes blink { 50% { opacity: 0; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes type {
    0% { transform: scaleX(0); } 50% { transform: scaleX(1); }
    82% { transform: scaleX(1); } 93% { transform: scaleX(0); } 100% { transform: scaleX(0); }
  }
  .typerect { transform-origin: 14px 0; transform-box: view-box; animation: type 5s linear infinite; }
  @keyframes caretmove {
    0% { transform: translateX(0); } 50% { transform: translateX(218px); }
    82% { transform: translateX(218px); } 93% { transform: translateX(0); } 100% { transform: translateX(0); }
  }
  .caretmove { animation: caretmove 5s linear infinite; }
  @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .floaty { animation: floaty 2.8s ease-in-out infinite alternate; }
  @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .twinkle { animation: twinkle var(--td, 2.4s) ease-in-out var(--tdel, 0s) infinite; }
  @keyframes shrinkR { 0%, 28% { transform: scaleX(1); } 48%, 94% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
  .oldline { transform-box: fill-box; transform-origin: right center; animation: shrinkR 4.5s linear infinite; }
  @keyframes growL { 0%, 50% { transform: scaleX(0); } 68%, 94% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
  .newline { transform-box: fill-box; transform-origin: left center; animation: growL 4.5s linear infinite; }
  @keyframes headpop { 0%, 66% { opacity: 0; } 74%, 94% { opacity: 1; } 100% { opacity: 0; } }
  .headpop { opacity: 0; animation: headpop 4.5s linear infinite; }
  @keyframes dotcycle { 0% { opacity: 0; } 6% { opacity: 1; } 78% { opacity: 1; } 86%, 100% { opacity: 0; } }
  .lit { opacity: 0; animation: dotcycle 6s linear infinite; animation-delay: var(--d, 0s); }
  @keyframes scanx { from { transform: translateX(-30px); } to { transform: translateX(330px); } }
  .scanrect { animation: scanx 6s linear infinite; }
  @keyframes blip { 0% { opacity: 0; } 2% { opacity: 1; } 32% { opacity: .5; } 62%, 100% { opacity: 0; } }
  .blip { opacity: 0; animation: blip 4.2s linear infinite; animation-delay: var(--bd, 0s); }
  @keyframes rimflare { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .rimflare { animation: rimflare 2.1s ease-in-out infinite; }
  @keyframes dashdrift { to { stroke-dashoffset: -192; } }
  .spin { stroke-dasharray: 70 26; animation: dashdrift var(--sd, 7s) linear infinite; }
</style></head>
